<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#000000"/>
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="240" cy="189" rx="400" ry="400" fill="url(#orb1)"/>
  <ellipse cx="960" cy="441" rx="350" ry="350" fill="url(#orb2)"/>
  <!-- Logo box -->
  <rect x="536" y="200" width="128" height="128" rx="28" fill="url(#logograd)"/>
  <defs>
    <linearGradient id="logograd" x1="536" y1="200" x2="664" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <text x="600" y="285" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="52" fill="#000000">SG</text>
  <!-- Title -->
  <text x="600" y="380" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="64" fill="#ffffff">SmartGym</text>
  <!-- Tagline -->
  <text x="600" y="440" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="300" font-size="28" fill="rgba(255,255,255,0.6)">Your pocket-sized personal trainer, powered by AI</text>
  <!-- Badge -->
  <rect x="548" y="458" width="104" height="32" rx="16" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1"/>
  <text x="600" y="479" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#34d399">BETA MVP</text>
</svg>
